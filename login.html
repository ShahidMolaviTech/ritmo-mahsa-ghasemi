<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assetes/css/style-login.css">
    <title>Document</title>
</head>

<body>

    <div class="form-wrapper">
        <div class="form-blur">
            <div class="blue"></div>
            <div class="red"></div>
        </div>
        <div class="form-content">
            <div class="logo">
                <div class="images"><img src="./assetes/images/logo2.png" alt=""></div>
                <h1>
                    به ریتمو خوش آمدید
                </h1>
                <h3>لطفا ایمیل خود را وارد کنید.

                </h3>
            </div>
            <form action="submit">
                <div class="form-title">
                    <div class="active">
                        <p> ورود </p>
                    </div>
                    <div >
                        <p> ثبت نام </p>
                    </div>
                </div>
                <input type="email" placeholder="ایمیل/نام کاربری">
                <input type="password" placeholder="رمز عبور">
                <p class="paragraph"> فراموشی رمز عبور </p>
                <button> ورود </button>
            </form>

        </div>
    </div>
</body>

</html>
